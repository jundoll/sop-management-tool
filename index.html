<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP管理システム</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- SheetJS CDN for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header" id="app-header" style="display:none;">
            <h1 id="page-title">SOP管理システム</h1>
            <div class="header-actions" id="header-actions"></div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Views will be rendered here -->
        </main>

        <!-- Modals -->
        <div class="modal-overlay" id="modal-overlay" style="display:none;">
            <div class="modal-content" id="modal-content">
                <!-- Step Form (Admin) -->
                <div class="step-form" id="step-form">
                    <div class="form-group">
                        <label for="step-instruction">作業指示内容 *</label>
                        <textarea id="step-instruction" rows="20" placeholder="ステップの作業内容を入力"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="step-comment">補足コメント</label>
                        <textarea id="step-comment" rows="4" placeholder="作業者向けの補足説明"></textarea>
                    </div>

                    <div class="form-group">
                        <label>参考画像</label>
                        <div class="image-upload-area" id="image-upload-area">
                            <div class="paste-hint">Ctrl+V で画像を貼り付け</div>
                            <div class="image-thumbnails" id="image-thumbnails"></div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 24px;">
                        <button id="save-step-btn" style="width: 100%; margin-bottom: 8px;">保存</button>
                        <button id="cancel-step-btn" class="secondary" style="width: 100%;">キャンセル</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/excelExport.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
