<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP管理システム</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Material Icons CDN -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- SheetJS CDN for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Main Navigation Menu (全ページ共通) -->
    <nav id="main-menu">
        <button class="menu-brand">SOP管理システム</button>
        <div class="menu-links">
            <button class="menu-item" data-view="selection">TOP</button>
            <button class="menu-item" data-view="admin">SOP作成</button>
            <button class="menu-item" data-view="player">実施画面</button>
        </div>
    </nav>

    <div id="app">
        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Views will be rendered here -->
        </main>

        <!-- Modals -->
        <div class="modal-overlay" id="modal-overlay" style="display:none;">
            <div class="modal-content" id="modal-content">
                <!-- Dynamic modal content will be inserted here -->
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/excelExport.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
